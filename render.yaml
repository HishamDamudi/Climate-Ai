services:
  - type: web
    name: climate-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173
        # After deploying the frontend to Vercel, update this to your real
        # Vercel URL (comma-separated if you need more than one), e.g.
        # https://climate-ai.vercel.app
      - key: LOG_LEVEL
        value: INFO
